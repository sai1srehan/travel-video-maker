name: Weekly travel video

on:
  schedule:
    - cron: "30 3 * * 0"   # every Sunday 03:30 UTC (09:00 IST)
  workflow_dispatch:
    inputs:
      city:
        description: "City (leave empty for next one in destinations.json)"
        required: false
      country:
        description: "Country"
        required: false
      portrait:
        description: "Vertical 1080x1920 (Shorts/Reels)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit output/history.json so next week picks a new city

jobs:
  make-video:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: denoland/setup-deno@v2   # yt-dlp needs a JavaScript runtime for YouTube
        with:
          deno-version: v2.x

      - run: pip install -r requirements.txt

      - name: Make video
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          YOUTUBE_TOKEN_JSON: ${{ secrets.YOUTUBE_TOKEN_JSON }}
          CITY: ${{ inputs.city }}
          COUNTRY: ${{ inputs.country }}
          PORTRAIT: ${{ inputs.portrait }}
        run: |
          args=()
          [ -n "$CITY" ] && args+=(--city "$CITY" --country "$COUNTRY")
          [ "$PORTRAIT" = "true" ] && args+=(--portrait)
          python main.py "${args[@]}"

      - name: Upload video
        uses: actions/upload-artifact@v4
        with:
          name: travel-video-${{ github.run_number }}
          path: |
            output/*/video.mp4
            output/*/thumbnail.jpg
            output/*/upload.txt
            output/*/plan.json
            output/*/youtube_url.txt
          retention-days: 30

      - name: Save history
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/history.json
          git commit -m "Weekly video: update history" || echo "nothing to commit"
          git push
